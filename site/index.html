<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SlotJob</title>
<meta name="description" content="SlotJob: Studierende buchen einzelne Schichten sofort, wenn Verhalten und Qualifikation reichen. Klickbarer Prototyp.">
<meta name="theme-color" content="#ffcd38">
<meta name="color-scheme" content="light only">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='0' y='6' width='40' height='28' rx='7' fill='%23ffcd38'/%3E%3Ccircle cx='0' cy='20' r='4.5' fill='%230e4f4a'/%3E%3Ccircle cx='40' cy='20' r='4.5' fill='%230e4f4a'/%3E%3Ccircle cx='20' cy='20' r='8' fill='none' stroke='%2310302d' stroke-width='2.6'/%3E%3Cpath d='M20 15.4V20l3.2 2.2' stroke='%2310302d' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* LAYOUT the working app in a phone frame on a plain teal stage; on a phone the app fills the screen.
   IDEA every slot is a shift ticket: a perforated stub with the start time printed large, a ticket number, a punch-out. */
:root{
  --stage:#ffcd38; --stage-ink:#16181b; --stage-mute:#4a3d00; --stage-line:#e0b21f;
  --canvas:#eeeeea; --card:#ffffff; --ink:#16181b; --mute:#575c62; --line:#dcddd7; --soft:#e7e7e2; --head:#ffcd38; --head-ink:#16181b;
  --sun:#ffcd38; --sun-ink:#1a1500; --coral:#ff5a45; --ok:#15803d; --brand:#16181b;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --text:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}

*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;background:var(--stage);color:var(--ink);font:16px/1.5 var(--text);overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}

/* stage */
.stage{min-height:100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:40px clamp(40px,7vw,112px);max-width:1280px;margin:0 auto;padding-block:40px;padding-left:max(24px,5vw,env(safe-area-inset-left,0px));padding-right:max(24px,5vw,env(safe-area-inset-right,0px));position:relative}
/* phone */
.phone{width:390px;height:min(844px,calc(100vh - 48px));min-height:660px;background:var(--canvas);border-radius:52px;border:12px solid #141414;box-shadow:0 0 0 2px rgba(0,0,0,.25),0 40px 80px -30px rgba(0,0,0,.65);overflow:hidden;display:flex;flex-direction:column;position:relative}
#root{display:flex;flex-direction:column;flex:1;min-height:0}
.top,.nav{flex:none}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 12px;background:var(--head);color:var(--head-ink)}
.logo{display:flex;align-items:center;gap:8px;font:800 21px/1 var(--display);letter-spacing:-.03em;color:var(--ink)}
.logo svg{width:30px;height:22px}
.logo .j{color:inherit}
.seg{display:flex;padding:3px;border-radius:999px;background:rgba(0,0,0,.09)}
.seg button{border:0;background:none;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:rgba(22,24,27,.7)}
.seg button.on{background:var(--ink);color:var(--card)}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--mute);background:var(--card)}
.chip:hover{border-color:var(--brand);color:var(--ink)}
.main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:18px 16px 28px;scrollbar-width:none}
.main::-webkit-scrollbar{display:none}
.nav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-top:1px solid var(--line);background:var(--card);padding-bottom:max(6px,env(safe-area-inset-bottom,0px))}
.nav button{background:none;border:0;padding:8px 4px 10px;font-size:12px;font-weight:600;color:var(--mute);min-height:58px;display:grid;justify-items:center;gap:3px}
.nav button svg{width:52px;height:30px;padding:4px 15px;border-radius:999px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:background .15s ease}
.nav button.on{color:var(--brand)}
.nav button.on svg{stroke-width:2.3;background:color-mix(in srgb,var(--brand) 15%,transparent)}
.nav button{padding-top:6px}
.badge{background:var(--coral);color:#fff;border-radius:999px;font-size:10px;font-weight:700;padding:0 5px;margin-left:2px}

h2{font:800 28px/1.05 var(--display);letter-spacing:-.03em;margin:2px 0 6px;text-wrap:balance}
h3{font:700 16.5px/1.3 var(--text);margin:0}
.sub{color:var(--mute);font-size:14px;margin:0 0 16px}
.filters{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px;margin:0 0 16px;padding:4px;background:var(--soft);border-radius:14px}
.f{border:0;background:none;border-radius:10px;padding:8px 10px;font-size:14px;text-wrap:balance;line-height:1.2;font-weight:600;min-height:40px;color:var(--mute);text-align:center}
.f.on{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line),0 2px 8px -4px rgba(0,0,0,.18)}
.f .n{font-weight:500;color:var(--mute);margin-left:4px;font-variant-numeric:tabular-nums}

/* ticket */
.ticket{background:var(--card);border-radius:18px;margin-bottom:14px;box-shadow:0 1px 0 var(--line),0 8px 22px -18px rgba(0,0,0,.35);position:relative;animation:rise .35s ease both}
.tk-top{display:grid;grid-template-columns:88px minmax(0,1fr);}
.when{position:relative;padding:16px 10px 14px;text-align:center;border-right:2px dashed var(--line)}
.when .d{font:600 12px var(--text);color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
.when .t{font:800 27px/1.05 var(--display);letter-spacing:-.03em;margin:3px 0 2px;font-variant-numeric:tabular-nums}
.when .e{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.what{padding:14px 14px 12px}
.emp{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:7px}
.where{font-size:13px;color:var(--mute);margin-top:2px}
.earn{font-size:13.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.earn b{font:800 19px var(--display);color:var(--ink);letter-spacing:-.02em;margin-right:4px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{font-size:12.5px;font-weight:600;background:var(--soft);border-radius:7px;padding:3px 8px;white-space:nowrap}
.tag.sun{background:var(--sun);color:var(--sun-ink)}
.tag.lock{background:color-mix(in srgb,var(--coral) 18%,transparent);color:var(--ink)}
.tag.pay{font-variant-numeric:tabular-nums}
.tk-bot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.cnt{font-size:13.5px;color:var(--mute)}
.cnt b{font:800 18px var(--display);color:var(--ink);margin-right:3px}
.btn{border:0;border-radius:12px;padding:10px 16px;min-height:44px;font-weight:700;background:var(--sun);color:var(--sun-ink);transition:transform .12s ease}
.btn:active{transform:scale(.97)}
.btn.dark{background:var(--ink);color:var(--card)}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn.done{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.btn[disabled]{background:var(--soft);color:var(--mute);cursor:not-allowed}
.btn.wide{width:100%}
.link{background:none;border:0;color:var(--brand);text-decoration:underline;text-underline-offset:3px;padding:6px 0 0;font-size:13.5px;font-weight:600}

.card{background:var(--card);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 1px 0 var(--line),0 6px 18px -14px rgba(0,0,0,.35)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sec{font:700 13px var(--text);color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:20px 0 8px}
.sec:first-of-type{margin-top:6px}
.status-pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--brand)}
.status-pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.stars{display:flex;gap:2px;margin-top:6px}
.stars button{background:none;border:0;font-size:30px;line-height:1;color:var(--line);min-width:38px;min-height:42px}
.stars button.on{color:#f2a900}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=number],input[type=time],select{width:100%;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);min-height:46px}
input[type=file]{font-size:13px;max-width:100%}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.check{display:flex;align-items:center;gap:10px;font-weight:500;margin:16px 0}
.check input{width:22px;height:22px;accent-color:var(--brand)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:10px 0 20px}
.days button{min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700}
.days button.on{background:var(--brand);color:var(--card);border-color:var(--brand)}
.onb{display:flex;flex-direction:column;min-height:100%}
.onb-hero{margin:-18px -16px 22px;padding:22px 18px 26px;background:var(--ink);color:var(--card);border-radius:0 0 28px 28px}
.onb-hero .logo{color:var(--card);margin-bottom:26px}
.onb-hero .big{color:var(--card);margin:0}
.onb .big{font:800 34px/1.02 var(--display);letter-spacing:-.035em;margin:28px 0 10px;text-wrap:balance}
.steps{display:flex;gap:6px;margin-top:4px}
.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}
.steps i.on{background:var(--brand)}
.pick{color:var(--ink);display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:var(--card)}
.pick:hover{border-color:var(--brand)}
.pick .ico{width:48px;height:48px;border-radius:14px;background:var(--sun);display:grid;place-items:center;color:var(--sun-ink)}
.pick .ico svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pick strong{display:block;font:800 19px var(--display);letter-spacing:-.02em;color:var(--ink)}
.pick span{color:var(--mute);font-size:14px}
.spacer{flex:1}
.bar{height:12px;background:var(--soft);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:6px;transition:width .4s ease}
.small{font-size:13px;color:var(--mute)}
.ways{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.upload{display:flex;align-items:center;justify-content:center;margin-top:12px;font-size:15px}
.upload:focus-within{outline:3px solid var(--sun);outline-offset:2px}
.big-num{font:800 30px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.app{font-size:14px;padding:9px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--soft);font:700 12px var(--text);margin-right:8px;color:var(--brand)}
.empty{text-align:center;color:var(--mute);padding:34px 10px}
.score{padding:12px 14px 8px;margin-bottom:18px}
.score h3{margin-bottom:4px}
.sc-row{display:grid;grid-template-columns:132px minmax(0,1fr) 36px;align-items:center;gap:10px;width:100%;border:0;background:none;padding:5px 0;color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.sc-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-bar{position:relative;height:8px;border-radius:99px;background:var(--soft)}
.sc-bar i{position:absolute;top:0;bottom:0;border-radius:99px;background:var(--ink)}
.sc-bar i.neg{background:var(--coral)}
.sc-val{font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.sc-ev{margin:2px 0 8px;padding:10px 12px;border-radius:12px;background:var(--canvas);font-size:13px}
.sc-ev div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.sc-ev b{font-variant-numeric:tabular-nums}
.sc-ev .rules{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 18px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute)}
.sc-ev .rules>div{display:block;padding:0}
.sc-ev .rules p{display:flex;justify-content:space-between;gap:6px;margin:0;padding:1px 0}
.sc-ev .rules b{color:var(--ink);font-weight:600}
.why{margin-top:8px;font-size:13px;font-weight:700;color:#c2321f}
.hint{margin-top:6px;font-size:12.5px;color:var(--mute)}
.hint .ok{color:var(--ink);font-weight:600}
.hint .no{color:#c2321f;font-weight:600}
.sc-sec{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:10px 0 0}
.app .sub{display:block;font-size:12.5px;color:var(--mute);margin-top:1px}
.app .btn{padding:8px 14px;font-size:14px;flex:none}
.yn{display:flex;align-items:center;gap:8px;margin-top:10px}
.yn .small{flex:1}
.yn button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:6px 16px;font:600 14px var(--text);min-height:38px}
.yn button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font:600 13.5px var(--text);min-height:34px;margin:-6px 0 12px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.toast{position:absolute;left:16px;right:16px;bottom:80px;background:var(--ink);color:var(--card);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:500;opacity:0;transform:translateY(10px);transition:.22s ease;pointer-events:none;z-index:5;display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;transform:none}
@keyframes rise{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.credits{color:var(--stage-ink);min-width:200px}
.credits .ev{font:800 40px/1 var(--display);letter-spacing:-.03em;margin:0}
.credits .grp{font:600 18px var(--text);color:var(--stage-mute);margin:10px 0 22px}
.credits ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:18px;line-height:1.35}
@media (max-width:600px),(max-height:560px) and (pointer:coarse){
  .credits{display:none}
  .stage{padding:0;display:block}
  html,body{overflow:hidden;overscroll-behavior:none}
  body{background:var(--canvas)}
  .phone{position:fixed;inset:0;width:auto;height:auto;min-height:0;border:0;border-radius:0;box-shadow:none}
  .top{padding-top:max(12px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <mask id="tkmask"><rect width="40" height="28" rx="7" fill="#fff"/><circle cx="0" cy="14" r="4.5" fill="#000"/><circle cx="40" cy="14" r="4.5" fill="#000"/></mask>
    <symbol id="mark" viewBox="0 0 40 28">
      <rect width="40" height="28" rx="7" fill="#ffcd38" mask="url(#tkmask)"/>
      <circle cx="20" cy="14" r="8" fill="none" stroke="#10302d" stroke-width="2.6"/>
      <path d="M20 9.4V14l3.2 2.2" stroke="#10302d" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    </symbol>
    <symbol id="mark-on-sun" viewBox="0 0 40 28">
      <rect width="40" height="28" rx="7" fill="#16181b" mask="url(#tkmask)"/>

      <path d="M20 9.4V14l3.2 2.2" stroke="#ffcd38" stroke-width="2.6" fill="none" stroke-linecap="round"/>

  </defs>
</svg>
<div class="stage">
  <aside class="credits" aria-label="Team">
    <p class="ev">HackWG 26</p>

    <ul>
      <li>Filip Neufeld</li>
      <li>Filip Zelinskyi</li>
      <li>Erik Dames</li>

  <div class="phone">
    <div id="root"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</div>
<script>
{
const KEY='slotjob-v7';
const DAYS=['Mo','Di','Mi','Do','Fr','Sa','So'];

const fresh=()=>({role:null,onb:0,field:'Maschinenbau',noExp:true,tab:'slots',filter:'ok',open:null,roles:[],instant:[],rated:{},cert:null,certRole:'Kellner',certs:{},biz:'Trattoria Lupo',etab:'mine',
 ev:[
  {a:'v',t:'Start',p:80},

  {a:'v',t:'Absage unter 24 h',p:-10},
  {a:'gastro',t:'14 Schichten',p:140,x:1},
  {a:'gastro',t:'11 × 5 Sterne',p:110},
  {a:'handel',t:'5 Schichten',p:50,x:1},
  {a:'handel',t:'2 × 5 Sterne',p:20}
 ],
 slots:[
  {id:1,emp:'Café Kantstein',title:'Service und Kasse',day:'Fr',date:'27.11.',s:'16:00',e:'20:00',pay:14.5,dist:'4 Min',noExp:true,fields:[],area:'gastro',min:0,minV:70},
  {id:2,emp:'Trattoria Lupo',title:'Kellner:in Abendschicht',day:'Sa',date:'28.11.',s:'18:00',e:'23:00',pay:15,dist:'9 Min',noExp:false,fields:[],area:'gastro',min:300,minV:70,eid:102},
  {id:3,emp:'Getränkemarkt Fass & Co',title:'Lager und Leergut',day:'Sa',date:'28.11.',s:'09:00',e:'13:00',pay:14,dist:'11 Min',noExp:true,fields:[],area:'handel',min:0,minV:70},

  else if(a==='filter'){S.filter=v}
  else if(a==='fieldf'){S.fieldOnly=!S.fieldOnly}
  else if(a==='instant'){const id=+v;if(S.instant.includes(id)){S.instant=S.instant.filter(x=>x!==id);toast('Buchung storniert')}else{S.instant.push(id);toast('Gebucht. Die Schicht steht unter Meine Schichten.')}}
  else if(a==='scopen'){S.open=S.open===v?null:v}
  else if(a==='rate'){const k=b.dataset.k;if(k[0]==='e'){const x=S.eslots.find(y=>'e'+y.id===k);x.rating=+v;
     if(ratedWho(x)==='Rudolf M.'){S.ev=S.ev.filter(e=>e.k!==k);const pts=STARQ[v],d=10+pts;S.ev.push({a:x.area,t:'Schicht '+x.title,p:10,x:1,k},{a:x.area,t:v+(+v===1?' Stern':' Sterne')+' von '+S.biz,p:pts,k});toast('Bewertung gespeichert. Rudolf M.: '+(d>=0?'+':'−')+Math.abs(d)+' Qualifikation in '+AN(x.area))}
     else toast('Bewertung gespeichert')}else{S.rated[k]=+v;toast('Bewertung gespeichert')}}
  else if(a==='punct'){const k=b.dataset.k,x=S.eslots.find(y=>'e'+y.id===k);x.punct=+v;
     if(ratedWho(x)==='Rudolf M.'){S.ev=S.ev.filter(e=>e.k!=='p'+k);S.ev.push({a:'v',t:(+v?'Pünktlich bei ':'Zu spät bei ')+S.biz,p:+v?2:-5,k:'p'+k});toast('Rudolf M.: Verhalten '+(+v?'+2':'−5'))}else toast('Gespeichert')}
  else if(a==='setrole'){if(S.role!==v){S.role=v;if(S.onb<99)S.onb=99}}
  else if(a==='switch'){S.role=S.role==='emp'?'studi':'emp';if(S.onb<99)S.onb=99}
  else if(a==='certok'){qualify(v,'Arbeitszeugnis '+v)}
  else if(a==='certgo'){S.tab='profil';S.certRole=v;save();render();const c=document.getElementById('certcard'),m=root.querySelector('.main');if(c&&m)m.scrollTop=c.offsetTop-m.offsetTop-12;return}
  else if(a==='reset'){S=fresh();toast('Zurückgesetzt')}
  const keep=root.querySelector('.main')?.scrollTop||0;
  save();render();
  if(a!=='tab'&&a!=='reset'){const m=root.querySelector('.main');if(m)m.scrollTop=keep}
});
root.addEventListener('change',e=>{
  if(e.target.id==='certrole'){S.certRole=e.target.value;save()}
  if(e.target.id==='cert'&&e.target.files[0]){const r=document.getElementById('certrole').value;S.certs[r]={file:e.target.files[0].name};save();render();toast('Arbeitszeugnis für '+r+' wird geprüft')}
});
root.addEventListener('submit',e=>{
  e.preventDefault();
  const g=id=>document.getElementById(id);
  const t=g('nt').value.trim()||'Schicht',d=g('nd').value,s=g('ns').value||'17:00',en=g('ne').value||'21:00',p=Math.max(13.9,parseFloat(g('np').value)||13.9);
  const id=Date.now(),area=g('na').value,min=Math.max(0,Math.min(1000,parseInt(g('nm').value,10)||0)),minV=Math.max(0,Math.min(100,parseInt(g('nv').value,10)||0));
  S.eslots.unshift({id,title:t,day:d,date:'',s,e:en,pay:p,noExp:min===0,area,min,minV,by:null,rating:0});
  S.slots.push({id:id+1,emp:S.biz,title:t,day:d,date:'',s,e:en,pay:p,dist:'neu',noExp:min===0,fields:g('nfd').value?[g('nfd').value]:[],area,min,minV,eid:id});
  S.etab='mine';save();render();toast('Slot veröffentlicht. Studis sehen ihn ab sofort.');
});
render();
}
</script>
</body>
</html>
